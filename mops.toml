[package]
name = "image-gen"
version = "0.1.0"
description = "Image generation MCP server wrapping fal.ai"
repository = "https://github.com/jneums/image-gen"
keywords = ["mcp", "image-generation", "fal-ai"]
license = "MIT"

[dependencies]
base = "0.16.0"
json = "1.4.0"
map = "9.0.1"
http-types = "1.0.1"
base-x-encoder = "2.1.0"
jwt = "2.1.0"
ecdsa = "7.1.0"
certified-cache = "0.3.0"
sha2 = "0.1.6"
ic = "3.2.0"
mcp-motoko-sdk = "2.0.2"

[dev-dependencies]
test = "2.1.1"

[toolchain]
moc = "0.16.2"
