canisters:
  - name: image-gen
    build: |
      mops toolchain init
      $(mops toolchain bin moc) src/main.mo \
        --public-metadata candid:service \
        --actor-idl idl \
        $(mops sources) \
        -o "$ICP_WASM_OUTPUT_PATH"

environments:
  - name: ic
    network: ic
    canisters: [image-gen]
